name: Manual Trigger Example

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production
      debug_mode:
        description: 'Enable verbose logging'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Print chosen inputs
        run: |
          echo "Deploying to: ${{ inputs.environment }}"
          echo "Debug mode: ${{ inputs.debug_mode }}"
